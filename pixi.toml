[workspace]
name = "curatorium-apollo"
version = "0.0.1"
description = "Apollo3 collaboration server (Curatorium fork) - pixi tasks for lint/test/build"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Node is pinned to 24.14 as a conda dependency below so the apollo toolchain is
# deterministic. Node 24.15+ changed CJS-loaded-via-ESM-translator behaviour, which
# breaks ESLint's config-loader (require.cache) and jest-resolve (require.resolve.paths)
# under Yarn PnP + ESM. Tasks invoke Berry directly via `node .yarn/releases/yarn-4.14.1.cjs`
# (NOT via corepack) - corepack's runVersion() calls require.resolve('corepack/package.json')
# to set COREPACK_ROOT, which Yarn PnP intercepts and rejects for nested yarn workspace
# calls inside scripts. The yarnPath below must match .yarnrc.yml's yarnPath field.
[dependencies]
python = "3.14.*"
nodejs = ">=24.14,<24.15"

[tasks]
# `pixi run -m apps/apollo/pixi.toml lint`
# Runs Apollo monorepo eslint (root package.json's `lint` script: yarn eslint).
lint = "bash -c 'cd \"$PIXI_PROJECT_ROOT\" && node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" lint'"

# `pixi run -m apps/apollo/pixi.toml test`
# Scoped to the auth/users specs that the Curatorium fork actively maintains,
# plus jbrowse.service.spec.ts (the Apollo col-server getPlugins() coverage
# this fork added). The full apollo-collaboration-server suite has ~20
# upstream NestJS scaffolds with unwired DI providers (pre-existing);
# upstream Apollo CI also runs only a 3/27-suite subset. Use `test-all` if
# you want the full picture.
#
# --watchman=false: on a deployment where two hosts share one checkout and
# one $TMPDIR over NFS (see the monorepo root CLAUDE_LOCAL.md for whether
# this deployment does), watchman derives its socket path from $TMPDIR, so
# both hosts resolve the same path - but a unix socket is host-local kernel
# state, so whichever host's jest run last bound it there owns it, and the
# other host's next run gets ECONNREFUSED against a socket it cannot
# cross-host connect to, crashing the whole jest process. A one-shot plain
# jest run (no --watch) gets nothing from watchman, so disable it outright
# rather than manage a daemon that can never be shared correctly.
test = "bash -c 'cd \"$PIXI_PROJECT_ROOT/packages/apollo-collaboration-server\" && LOG=\"$(mktemp)\"; node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" node --experimental-vm-modules $(node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" bin jest) --watchman=false src/authentication/ src/users/ src/jbrowse/jbrowse.service.spec.ts > \"$LOG\" 2>&1; rc=$?; grep -E \"^FAIL \" \"$LOG\"; grep -E \"^(Test Suites|Tests|Snapshots|Time): \" \"$LOG\" | sed -E \"s/, [0-9]+ passed//g; s/[0-9]+ passed, //g; s/[0-9]+ passed//g\"; echo \"Full log: $LOG\"; exit $rc'"

# `pixi run -m apps/apollo/pixi.toml test-all`
# Full ACS jest suite - many upstream scaffolds are red.
# --watchman=false: see the note on `test` above - same cross-host socket hazard.
test-all = "bash -c 'cd \"$PIXI_PROJECT_ROOT/packages/apollo-collaboration-server\" && LOG=\"$(mktemp)\"; node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" node --experimental-vm-modules $(node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" bin jest) --watchman=false > \"$LOG\" 2>&1; rc=$?; grep -E \"^FAIL \" \"$LOG\"; grep -E \"^(Test Suites|Tests|Snapshots|Time): \" \"$LOG\" | sed -E \"s/, [0-9]+ passed//g; s/[0-9]+ passed, //g; s/[0-9]+ passed//g\"; echo \"Full log: $LOG\"; exit $rc'"

# `pixi run -m apps/apollo/pixi.toml build`
# Canonical host build (mirrors Dockerfile): builds the JBrowse UMD plugin, then the
# NestJS collaboration-server - producing the packages/*/dist that the host test + lint
# (and the pre-commit hook) need. Run once after a fresh clone / `pixi run install`.
# NOTE: yarn path must match yarnPath in .yarnrc.yml - update both together when bumping yarn.
build = "bash -c 'cd \"$PIXI_PROJECT_ROOT\" && (cd packages/jbrowse-plugin-apollo && JB_UMD=true node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" build) && (cd packages/apollo-collaboration-server && node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" build)'"

# Convenience for installing the Yarn PnP cache after pulling new commits.
install = "bash -c 'cd \"$PIXI_PROJECT_ROOT\" && node \"$PIXI_PROJECT_ROOT/.yarn/releases/yarn-4.14.1.cjs\" install --immutable'"

# Redirects Python's bytecode cache to a per-account directory via $HOME, so a build or
# install step this workspace runs as root does not leave root-owned .pyc files in the
# nfs4-shared checkout. ${HOME:?...} is bash's strict-parameter-expansion form (pixi
# activation.env is evaluated by a real bash): unset/empty $HOME fails activation loudly
# instead of silently writing under the filesystem root. See the root pyproject.toml's copy
# of this table for the full rationale.
[target.unix.activation.env]
PYTHONPYCACHEPREFIX = "${HOME:?HOME must be set for the pycache redirect}/.cache/curatorium-pycache"
